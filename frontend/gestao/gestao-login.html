<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.E.A PCL</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="background-effects"></div>

<main>

    <section>
        <div class="gea">G.E.A</div>

        <p class="school">
            <b>Pedro Casemiro Leite</b>
        </p>
    </section>

    <section>

        <h1>Seja Bem-Vindo</h1>

        <form id="formstudent">

            <label for="password">Senha da Gestão</label>

            <input
                id="password"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="off"
                required
            >

            <button class="intial-button" type="submit">
            Entrar
            </button>

        </form>

        <div class="link-adm">
            <a href="../index.html">
                Acessar o painel do Aluno
            </a>
        </div>

    </section>

</main>

<script>
    document.getElementById("formstudent").addEventListener("submit", function(event) {
        event.preventDefault();

        window.location.href = "dashboard.html";
    });
</script>

</body>

</html>
