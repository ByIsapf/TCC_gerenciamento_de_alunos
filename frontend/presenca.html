<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Presença | G.E.A</title>

    <link rel="stylesheet" href="css/presenca.css">
</head>

<body>

    <main class="presenca-page">

        <div class="gea-logo">
            <span>G.E.A</span>
            <p>Gerenciamento de Alunos</p>
        </div>

        <section class="presenca-card">

            <div class="status-icon" id="status-icon">
                ✓
            </div>

            <h1 id="status-titulo">
                Verificando presença...
            </h1>

            <p class="mensagem" id="status-mensagem">
                Aguarde enquanto validamos seu acesso.
            </p>

            <div class="dados-presenca" id="dados-presenca">

                <div class="dado">
                    <span>Aluno</span>
                    <strong id="nome-aluno">---</strong>
                </div>

                <div class="dado">
                    <span>Data</span>
                    <strong id="data-presenca">---</strong>
                </div>

                <div class="dado">
                    <span>Horário</span>
                    <strong id="horario-presenca">---</strong>
                </div>

            </div>

            <p class="escola">
                Escola Pedro Casemiro Leite
            </p>

        </section>

    </main>

    <script src="js/presenca.js"></script>

</body>

</html>
